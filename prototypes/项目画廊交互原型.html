<script>
const projects=JSON.parse(document.querySelector('#projects').textContent);
const descriptions={Zhiye:'知野：面向乡村小学教师的课堂复盘与精准补讲原型。README 描述从课堂录音到复习卡、教师报告、补讲教案与练习的流程；目前的多用户、公网 AI 能力需按项目当前状态说明。',Lumi:'Lumi 恋语：本地优先的 AI 关系沟通伙伴。README 列出 React 前端、Express API 与 AI 集成，以及本地运行和部署说明。','zxcvbn-MoonBit':'Dropbox zxcvbn 密码强度估计器的 MoonBit 移植。README 描述模式匹配、猜测次数估计、强度反馈、API 和测试策略。','journeyvault-obsidian-travel-os':'JourneyVault：个性化旅行规划、智能行李与 Obsidian 项目导出 Skill。README 描述导出脚本、结构校验和安全回归测试。','pres-zero-basics-navigation':'PRES：零基础项目学习导航 Skill，将真实项目组织为能力地图、课程和断点续学记录。','moodweaver-life-orchestrator':'MoodWeaver：围绕时间、预算与生活能量组织理想轨、省电轨和救场轨的生活规划 Skill。',Realm:'藏梦书境：把心事写成童话的 Web 探索原型。README 明确当前本地单实例 Demo 边界；真实生图尚未验收，完整七章绘本仍为后续目标。','algorithm-visualizer':'排序算法可视化学习工具。README 描述 HTML 与 Streamlit 两种展示方式，包含代码高亮、暂停与单步等交互。',ShengXinGO:'README 提供 GO 代码包、Figma 原稿与前后端启动方式；具体业务、当前功能与贡献细节尚未补充。'};
const names={Zhiye:'ZHIYE',Lumi:'LUMI','zxcvbn-MoonBit':'ZXCVBN','journeyvault-obsidian-travel-os':'JOURNEY VAULT','pres-zero-basics-navigation':'PRES','moodweaver-life-orchestrator':'MOOD WEAVER',Realm:'REALM','algorithm-visualizer':'ALGORITHM',ShengXinGO:'GO','project-weekly-closure':'WEEKLY CLOSURE',Cheng:'CHENG',Skills:'SKILLS'};
const palettes=[['#e7ede3','#263b30'],['#f0d6df','#482b39'],['#e9e5e1','#282128'],['#e5dfeb','#493952'],['#e5e8ee','#2f3c51'],['#f0e5d8','#59412d']];
const stage=document.querySelector('#stage'),detail=document.querySelector('#detail'),directoryDialog=document.querySelector('#directory-dialog');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let collection='works',items=[],cards=[],offset=0,velocity=.12,target=.12,lastFrame=performance.now(),enteredAt=0,visible=false,paused=reduced.matches,dragging=false,pointerX=null,dragStart=0,dragDistance=0,lastMove=0,lastSign=0,focused=false,lastInput='pointer';
const wrap=(n,total)=>((n+total/2)%total+total)%total-total/2;

function updatePause(){const button=document.querySelector('#pause');button.textContent=paused?'▶':'Ⅱ';button.setAttribute('aria-label',paused?'开始自动播放':'暂停自动播放');button.setAttribute('aria-pressed',String(paused));}
function build(){
 stage.querySelectorAll('.art').forEach(node=>node.remove());
 items=projects.filter(p=>collection==='forks'?p.fork:!p.fork);
 const order=['Zhiye','Lumi','zxcvbn-MoonBit'];items.sort((a,b)=>(order.indexOf(a.name)<0?99:order.indexOf(a.name))-(order.indexOf(b.name)<0?99:order.indexOf(b.name)));
 cards=items.map((project,index)=>{
  const el=document.createElement('button');el.className='art kind-'+(project.fork?'fork':project.name==='zxcvbn-MoonBit'?'engineering':/vault|pres-|mood|Skills/.test(project.name)?'skill':'product');
  el.setAttribute('aria-label','查看项目 '+project.name);const palette=palettes[index%palettes.length];el.style.setProperty('--poster',palette[0]);el.style.setProperty('--poster-ink',palette[1]);
  const canvas=document.createElement('div');canvas.className='canvas';
  for(const [className,text] of [['poster-label','PAPERY / '+String(index+1).padStart(2,'0')],['poster-title',names[project.name]||project.name.toUpperCase()],['poster-caption',project.fork?'OPEN SOURCE / FORK':'CONCEPT COVER / PROJECT']]){const node=document.createElement('div');node.className=className;node.textContent=text;canvas.append(node);}
  for(const className of ['shape shape-a','shape shape-b']){const node=document.createElement('div');node.className=className;canvas.append(node);}
  const placard=document.createElement('div');placard.className='placard';for(const text of [project.name,project.fork?'FORK':'VIEW PROJECT ↗']){const node=document.createElement('span');node.textContent=text;placard.append(node);}
  el.append(canvas,placard);stage.append(el);
  el.addEventListener('click',()=>{if(dragDistance>6){dragDistance=0;return;}openProject(project);});
  el.addEventListener('focus',()=>{if(lastInput==='keyboard')focused=true;});el.addEventListener('blur',()=>focused=false);
  return el;
 });offset=0;velocity=.12;target=.12;enteredAt=performance.now();updatePause();
}
function openProject(project){
 document.querySelector('#detail-title').textContent=names[project.name]||project.name;
 document.querySelector('#detail-meta').textContent=project.name+' · '+(project.fork?'学习 / Fork':project.primaryLanguage||'项目')+' · 公开资料快照 2026-10-03';
 document.querySelector('#detail-copy').textContent=descriptions[project.name]||(project.fork?'公开仓库标记为 Fork，作为学习或参考收录。具体改动与上游贡献尚未补充。':'已收录此公开仓库。功能说明、运行状态与真实项目截图等待补充，不根据名称猜测。');
 document.querySelector('#detail-note').textContent=project.fork?'这是 Fork 仓库，不标为独立原创成果。':(['Zhiye','Lumi','zxcvbn-MoonBit'].includes(project.name)?'本人说明：全栈负责，采用 Vibe coding / AI 辅助开发。具体设计决策、调试与验证记录待补充；本预览没有运行或测量项目成果。':'当前介绍依据公开 README 或元数据。具体贡献与运行成果尚未逐项核对。');
 document.querySelector('#github-link').href=project.url;
 if(directoryDialog.open)directoryDialog.close();detail.showModal();
}
document.querySelector('#close-detail').onclick=()=>detail.close();document.querySelector('#close-directory').onclick=()=>directoryDialog.close();
for(const dialog of [detail,directoryDialog]){dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});dialog.addEventListener('close',()=>{focused=false;lastMove=0;});}
for(const project of projects){const b=document.createElement('button');b.textContent=project.name;const s=document.createElement('small');s.textContent=project.fork?'学习 / Fork':project.primaryLanguage||'公开项目';b.append(s);b.onclick=()=>openProject(project);document.querySelector('#directory-list').append(b);}
document.querySelector('#directory').onclick=()=>directoryDialog.showModal();
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.theme;document.querySelectorAll('button[data-theme]').forEach(other=>{const active=other===b;other.classList.toggle('active',active);other.setAttribute('aria-pressed',String(active));});});
document.querySelectorAll('[data-collection]').forEach(b=>b.onclick=()=>{collection=b.dataset.collection;document.querySelectorAll('[data-collection]').forEach(other=>other.classList.toggle('active',other===b));build();});
document.querySelector('#pause').onclick=()=>{paused=!paused;focused=false;updatePause();};
document.querySelector('#previous').onclick=()=>{offset=(offset-1+items.length)%items.length;lastMove=0;};document.querySelector('#next').onclick=()=>{offset=(offset+1)%items.length;lastMove=0;};
document.addEventListener('keydown',e=>{lastInput='keyboard';if(modalOpen())return;if(document.activeElement?.classList.contains('art')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();offset=(offset+(e.key==='ArrowLeft'?-1:1)+items.length)%items.length;focused=true;}});
document.addEventListener('pointerdown',()=>lastInput='pointer');
stage.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;pointerX=e.clientX;dragStart=e.clientX;dragDistance=0;stage.classList.add('dragging');});
stage.addEventListener('pointermove',e=>{
 const dx=pointerX===null?0:e.clientX-pointerX;pointerX=e.clientX;
 if(dragging){offset=(offset-dx/cardSpacing()+items.length)%items.length;dragDistance=Math.max(dragDistance,Math.abs(e.clientX-dragStart));velocity=0;lastMove=0;}
 else if(e.pointerType!=='touch'&&Math.abs(dx)>=2){lastSign=dx>0?-1:1;target=lastSign*Math.min(.8,.24+Math.abs(dx)*.018);lastMove=performance.now();}
});
function endDrag(){dragging=false;stage.classList.remove('dragging');pointerX=null;lastMove=0;}
window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',endDrag);stage.addEventListener('pointerleave',()=>{if(!dragging){pointerX=null;lastMove=0;}});
function cardSpacing(){return innerWidth<700?228:Math.max(300,innerWidth/4.15);}
new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(visible&&!enteredAt)enteredAt=performance.now();},{threshold:.15}).observe(stage);
reduced.addEventListener('change',()=>{paused=reduced.matches;updatePause();});
function frame(now){
 const dt=Math.min((now-lastFrame)/1000,.05);lastFrame=now;
 const suspended=paused||focused||modalOpen()||!visible||document.hidden;
 if(!dragging&&!suspended){if(now-lastMove>1100)target=.12;velocity+=(target-velocity)*(1-Math.exp(-dt*4));offset=(offset+velocity*dt+items.length)%items.length;}
 const spacing=cardSpacing(),cardWidth=innerWidth<700?204:spacing-20,cardHeight=innerWidth<700?300:Math.min(420,Math.max(350,cardWidth*1.2));
 cards.forEach((el,index)=>{
  const delta=wrap(index-offset,items.length);const angle=delta*.13;const visibleCard=Math.abs(delta)<(innerWidth<700?1.6:3.1);
  const entry=reduced.matches?1:Math.max(0,Math.min(1,(now-enteredAt-Math.min(Math.abs(wrap(index,items.length)),4)*85)/700));const eased=1-Math.pow(1-entry,3);
  const edge=Math.min(delta*delta,9),x=spacing*(delta+.018*delta*delta*delta),y=-(1-eased)*280;
  const scaleX=(1+.085*edge)/Math.cos(angle),scaleY=1+.045*edge;
  el.style.width=cardWidth+'px';el.style.height=cardHeight+'px';el.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,0px) rotateY(${angle*180/Math.PI}deg) scale(${scaleX},${scaleY})`;
  el.style.opacity=visibleCard?eased:0;el.style.zIndex=String(100-Math.round(Math.abs(delta)*10));el.classList.toggle('invisible',!visibleCard);el.tabIndex=visibleCard?0:-1;el.setAttribute('aria-hidden',String(!visibleCard));
 });
 const current=((Math.round(offset)%items.length)+items.length)%items.length;document.querySelector('#count').textContent=String(current+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0');
 document.querySelector('#direction').textContent=suspended?'PAUSED':dragging?'DRAG':now-lastMove>1100?'AUTO · ←':target>=0?'POINTER · ←':'POINTER · →';
 requestAnimationFrame(frame);
}
Object.defineProperty(window,'galleryDebug',{get:()=>({offset,velocity,target,paused,dragging,count:items.length,collection,modalOpen:modalOpen(),visible,theme:document.documentElement.dataset.theme||'light'})});
build();requestAnimationFrame(frame);
